<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - StockFlow</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme script (prevents FOUC) -->
    <script src="assets/js/theme.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bs-body-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: var(--bs-card-bg, #fff);
            border: 1px solid var(--bs-border-color);
        }
        .logo-icon {
            font-size: 3rem;
            color: #1e3a8a;
        }
        [data-bs-theme="dark"] .logo-icon {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-box-seam logo-icon"></i>
            <h2 class="fw-bold mt-2 mb-0">StockFlow</h2>
            <p class="text-muted small">Gestión Inteligente de Inventario</p>
        </div>

        <form id="formLogin">
            <div id="loginError" class="alert alert-danger d-none small py-2">
                Usuario o contraseña incorrectos.
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-medium">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="loginUsername" placeholder="admin" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-medium">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="admin123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium mb-3">
                Ingresar al Sistema
            </button>
            
            <div class="text-center">
                <span class="text-muted small">Demo de StockFlow. Usa <b>admin</b> / <b>admin123</b></span>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth Logic -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
