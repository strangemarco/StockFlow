<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - StockFlow</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Auth Guard (must run first) -->
    <script src="../../assets/js/auth-guard.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <!-- Theme script (prevents FOUC) -->
    <script src="../../assets/js/theme.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-box-seam logo-icon"></i>
                <span class="logo-text ms-2">StockFlow</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="../dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link" href="../ventas/nueva-venta.html">
                    <i class="bi bi-cart"></i>
                    <span>Ventas</span>
                </a>
                <a class="nav-link active" href="productos.html">
                    <i class="bi bi-box"></i>
                    <span>Productos</span>
                </a>
                <a class="nav-link" href="../categorias/categorias.html">
                    <i class="bi bi-tags"></i>
                    <span>Categorías</span>
                </a>
                <a class="nav-link" href="../inventario/inventario.html">
                    <i class="bi bi-boxes"></i>
                    <span>Inventario</span>
                </a>
                <a class="nav-link" href="../compras/nueva-compra.html">
                    <i class="bi bi-truck"></i>
                    <span>Compras</span>
                </a>
                <a class="nav-link" href="../personas/personas.html">
                    <i class="bi bi-people"></i>
                    <span>Personas</span>
                </a>
                <a class="nav-link" href="../reportes/reportes.html">
                    <i class="bi bi-bar-chart"></i>
                    <span>Reportes</span>
                </a>
                <a class="nav-link" href="../usuarios/usuarios.html">
                    <i class="bi bi-person-badge"></i>
                    <span>Usuarios</span>
                </a>
                <a class="nav-link" href="../configuracion/configuracion.html">
                    <i class="bi bi-gear"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Topbar -->
            <header class="top-navbar">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light btn-sm me-3" id="sidebarToggle">
                        <i class="bi bi-list fs-5"></i>
                    </button>
                    <h5 class="mb-0 text-muted">Productos</h5>
                </div>
                <div class="d-flex align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 me-2"></i> Admin
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="btnLogout"><i class="bi bi-box-arrow-right me-2"></i>Salir</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-0">Catálogo de Productos</h2>
                        <p class="text-muted mb-0">Gestiona todos los productos de tu inventario.</p>
                    </div>
                    <a href="crear-producto.html" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
                    </a>
                </div>

                <!-- Filters & Search -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6 col-lg-4">
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="searchProducto" placeholder="Buscar por nombre o código...">
                                </div>
                            </div>
                            <div class="col-md-3 col-lg-3">
                                <select class="form-select" id="filterEstado">
                                    <option value="">Todos los estados</option>
                                    <option value="Activo">Activo</option>
                                    <option value="Stock bajo">Stock bajo</option>
                                    <option value="Agotado">Agotado</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Código</th>
                                        <th>Producto</th>
                                        <th>Categoría</th>
                                        <th>Precio Venta</th>
                                        <th>Stock</th>
                                        <th>Stock Min.</th>
                                        <th>Estado</th>
                                        <th style="width: 100px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="productosTableBody">
                                    <!-- Rows rendered by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top border-light py-3" id="productosPagination">
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App Scripts -->
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/helpers.js"></script>
    <script src="../../assets/js/data/productos.data.js"></script>
    <script src="../../assets/js/modules/productos.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
