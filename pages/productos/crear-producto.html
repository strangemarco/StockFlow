<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - StockFlow</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Auth Guard (must run first) -->
    <script src="../../assets/js/auth-guard.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <!-- Theme script (prevents FOUC) -->
    <script src="../../assets/js/theme.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-box-seam logo-icon"></i>
                <span class="logo-text ms-2">StockFlow</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="../dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link" href="../ventas/nueva-venta.html">
                    <i class="bi bi-cart"></i>
                    <span>Ventas</span>
                </a>
                <a class="nav-link active" href="productos.html">
                    <i class="bi bi-box"></i>
                    <span>Productos</span>
                </a>
                <a class="nav-link" href="../categorias/categorias.html">
                    <i class="bi bi-tags"></i>
                    <span>Categorías</span>
                </a>
                <a class="nav-link" href="../inventario/inventario.html">
                    <i class="bi bi-boxes"></i>
                    <span>Inventario</span>
                </a>
                <a class="nav-link" href="../compras/nueva-compra.html">
                    <i class="bi bi-truck"></i>
                    <span>Compras</span>
                </a>
                <a class="nav-link" href="../personas/personas.html">
                    <i class="bi bi-people"></i>
                    <span>Personas</span>
                </a>
                <a class="nav-link" href="../reportes/reportes.html">
                    <i class="bi bi-bar-chart"></i>
                    <span>Reportes</span>
                </a>
                <a class="nav-link" href="../usuarios/usuarios.html">
                    <i class="bi bi-person-badge"></i>
                    <span>Usuarios</span>
                </a>
                <a class="nav-link" href="../configuracion/configuracion.html">
                    <i class="bi bi-gear"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Topbar -->
            <header class="top-navbar">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light btn-sm me-3" id="sidebarToggle">
                        <i class="bi bi-list fs-5"></i>
                    </button>
                    <nav aria-label="breadcrumb" class="d-none d-md-block">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="productos.html" class="text-decoration-none text-muted">Productos</a></li>
                            <li class="breadcrumb-item active" aria-current="page" id="breadcrumbCurrent">Formulario</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 me-2"></i> Admin
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="btnLogout"><i class="bi bi-box-arrow-right me-2"></i>Salir</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-0" id="formTitle">Nuevo Producto</h2>
                        <p class="text-muted mb-0">Completa la información del producto.</p>
                    </div>
                    <a href="productos.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Volver al listado
                    </a>
                </div>

                <div class="card">
                    <div class="card-body p-4">
                        <form id="formProduct">
                            <div class="row mb-4">
                                <div class="col-12 border-bottom pb-2 mb-3">
                                    <h5 class="text-primary"><i class="bi bi-info-circle me-2"></i>Información General</h5>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="codigo" class="form-label">Código Interno <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="codigo" required placeholder="Ej: PROD-001">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="codigoBarras" class="form-label">Código de Barras</label>
                                    <input type="text" class="form-control" id="codigoBarras" placeholder="Escanear o ingresar...">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombre" required placeholder="Ej: Coca Cola 2L">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="categoriaId" class="form-label">Categoría <span class="text-danger">*</span></label>
                                    <select class="form-select" id="categoriaId" required>
                                        <option value="">Seleccione una categoría</option>
                                    </select>
                                </div>
                                <div class="col-12 mb-3">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="descripcion" rows="2" placeholder="Detalles adicionales del producto..."></textarea>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-12 border-bottom pb-2 mb-3">
                                    <h5 class="text-primary"><i class="bi bi-currency-dollar me-2"></i>Precios</h5>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="precioCompra" class="form-label">Precio de Compra <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" min="0" class="form-control" id="precioCompra" required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="precioVenta" class="form-label">Precio de Venta <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" min="0" class="form-control" id="precioVenta" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-12 border-bottom pb-2 mb-3">
                                    <h5 class="text-primary"><i class="bi bi-boxes me-2"></i>Inventario</h5>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="stock" class="form-label">Stock Actual <span class="text-danger">*</span></label>
                                    <input type="number" min="0" class="form-control" id="stock" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="stockMinimo" class="form-label">Stock Mínimo (Alerta) <span class="text-danger">*</span></label>
                                    <input type="number" min="0" class="form-control" id="stockMinimo" required value="5">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="productos.html" class="btn btn-light border">Cancelar</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App Scripts -->
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/helpers.js"></script>
    <script src="../../assets/js/data/categorias.data.js"></script>
    <script src="../../assets/js/modules/categorias.js"></script>
    <script src="../../assets/js/modules/productos.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
