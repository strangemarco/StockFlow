<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta - StockFlow</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Auth Guard (must run first) -->
    <script src="../../assets/js/auth-guard.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <style>
        .product-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
            border-color: var(--primary-color)!important;
        }
        .cart-container {
            height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }
        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
        }
        .cart-summary {
            border-top: 2px dashed #eee;
            padding-top: 1rem;
        }
        .qty-input {
            width: 60px;
            text-align: center;
        }
    </style>
    <!-- Theme script (prevents FOUC) -->
    <script src="../../assets/js/theme.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-box-seam logo-icon"></i>
                <span class="logo-text ms-2">StockFlow</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="../dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                
                <div class="nav-link active bg-primary-custom text-white fw-bold d-flex justify-content-between align-items-center" style="cursor:default">
                    <div><i class="bi bi-cart"></i><span>Ventas</span></div>
                </div>
                <a class="nav-link active ms-3 border-start border-white border-2" href="nueva-venta.html">
                    <i class="bi bi-cart-plus"></i><span>Nueva Venta</span>
                </a>
                <a class="nav-link ms-3" href="historial.html">
                    <i class="bi bi-receipt"></i><span>Historial</span>
                </a>

                <a class="nav-link mt-2" href="../productos/productos.html"><i class="bi bi-box"></i><span>Productos</span></a>
                <a class="nav-link" href="../categorias/categorias.html"><i class="bi bi-tags"></i><span>Categorías</span></a>
                <a class="nav-link" href="../inventario/inventario.html"><i class="bi bi-boxes"></i><span>Inventario</span></a>
                <a class="nav-link" href="../compras/nueva-compra.html"><i class="bi bi-truck"></i><span>Compras</span></a>
                <a class="nav-link" href="../personas/personas.html"><i class="bi bi-people"></i><span>Personas</span></a>
                <a class="nav-link" href="../reportes/reportes.html"><i class="bi bi-bar-chart"></i><span>Reportes</span></a>
                <a class="nav-link" href="../usuarios/usuarios.html"><i class="bi bi-person-badge"></i><span>Usuarios</span></a>
                <a class="nav-link" href="../configuracion/configuracion.html"><i class="bi bi-gear"></i><span>Configuración</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Topbar -->
            <header class="top-navbar">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light btn-sm me-3" id="sidebarToggle">
                        <i class="bi bi-list fs-5"></i>
                    </button>
                    <h5 class="mb-0 text-muted">Nueva Venta (POS)</h5>
                </div>
                <div class="d-flex align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 me-2"></i> Admin
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="btnLogout"><i class="bi bi-box-arrow-right me-2"></i>Salir</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content-area py-3">
                <div class="row g-4">
                    <!-- Left: Products -->
                    <div class="col-lg-7 col-xl-8">
                        <div class="card h-100 border-0 shadow-sm" style="min-height: calc(100vh - 120px);">
                            <div class="card-body">
                                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
                                    <h5 class="card-title fw-bold mb-0">Catálogo de Productos</h5>
                                    <div class="input-group" style="max-width: 350px;">
                                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                                        <input type="text" class="form-control" id="posSearch" placeholder="Buscar por código o nombre...">
                                    </div>
                                </div>
                                
                                <div class="row g-3" id="posProductList">
                                    <!-- Productos inyectados por JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right: Cart -->
                    <div class="col-lg-5 col-xl-4">
                        <div class="card border-0 shadow-sm cart-container">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold mb-3"><i class="bi bi-cart3 me-2"></i>Carrito de Compra</h5>
                                
                                <div class="mb-3">
                                    <label class="form-label text-muted small mb-1">Cliente</label>
                                    <select class="form-select form-select-sm" id="posCliente">
                                        <!-- Opciones inyectadas por JS -->
                                    </select>
                                </div>

                                <div class="cart-items mb-3 pe-2" id="posCartItems">
                                    <!-- Items inyectados por JS -->
                                    <div class="text-center text-muted mt-5 h-100 d-flex flex-column justify-content-center">
                                        <i class="bi bi-cart-x fs-1 opacity-50 mb-2"></i>
                                        <p>El carrito está vacío</p>
                                    </div>
                                </div>

                                <div class="cart-summary mt-auto">
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">Artículos:</span>
                                        <span class="fw-bold" id="posTotalItems">0</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3 fs-3">
                                        <span class="fw-bold">Total:</span>
                                        <span class="fw-bold text-primary" id="posTotalAmount">$0.00</span>
                                    </div>
                                    <button class="btn btn-primary w-100 py-3 fw-bold text-uppercase fs-5 shadow-sm" id="btnProcesarVenta" disabled>
                                        Cobrar <i class="bi bi-arrow-right-circle ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App Scripts -->
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/helpers.js"></script>
    <script src="../../assets/js/modules/personas.js"></script>
    <script src="../../assets/js/modules/productos.js"></script>
    <script src="../../assets/js/modules/inventario.js"></script>
    <script src="../../assets/js/modules/ventas.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
